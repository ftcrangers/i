<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d2b"><title>Team Portal | Itkan Rangers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--g:#176b43;--d:#103d2b;--m:#e9f4ed;--p:#f5f8f5;--i:#17231c;--mut:#65736a;--l:#dce7de}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px "DM Sans",sans-serif;line-height:1.55}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}aside{background:#102b20;color:white;padding:24px 17px;display:flex;flex-direction:column;gap:22px}.brand{font:800 1.1rem Manrope}.brand small{display:block;color:#a8c9b2;font:700 .65rem "DM Sans";letter-spacing:.14em}.switch{width:100%;padding:11px;border:1px solid #365b44;border-radius:11px;background:#173b29;color:white}.side-nav{display:grid;gap:5px}.side-nav button{border:0;text-align:left;border-radius:9px;padding:11px;background:transparent;color:#c9dbce;font-weight:700}.side-nav button.active,.side-nav button:hover{background:#24573a;color:white}.bottom{margin-top:auto;color:#91aa98;font-size:.75rem}.main{min-width:0;padding:32px clamp(18px,4vw,55px)}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.top h1{font:800 clamp(1.8rem,4vw,2.5rem) Manrope;margin:0;letter-spacing:-.05em}.muted{color:var(--mut)}.btn{border:0;border-radius:10px;background:var(--g);color:white;font-weight:800;padding:11px 15px}.secondary{background:var(--m);color:var(--d);border:1px solid var(--l)}.danger{background:#a83e36}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid var(--l);border-radius:16px;padding:20px;min-width:0}.stat{font:800 2rem Manrope;color:var(--g);margin:6px 0}.label{font-size:.67rem;font-weight:800;letter-spacing:.12em;color:var(--mut)}.panel{margin-top:20px}.panel h2{font:800 1.15rem Manrope;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--l)}.row strong{display:block}.row small{display:block;color:var(--mut)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--m);color:var(--d);font-size:.7rem;font-weight:800;text-transform:capitalize}.form{display:grid;gap:12px;max-width:580px}.form label{display:grid;gap:6px;font-size:.8rem;font-weight:800}.form input,.form select{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;background:white}.auth{max-width:460px;margin:10vh auto;padding:28px;background:white;border:1px solid var(--l);border-radius:20px}.auth h1{font:800 1.8rem Manrope}.notice{padding:13px;background:#fff7df;border:1px solid #ead9a6;border-radius:10px;margin:12px 0}.output{padding:13px;background:var(--m);border:1px solid var(--l);border-radius:10px;overflow-wrap:anywhere}.empty{padding:25px;text-align:center;border:1px dashed #b7c9bb;border-radius:14px;color:var(--mut)}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{padding:15px}.side-nav{display:flex;overflow:auto}.side-nav button{white-space:nowrap}.bottom{display:none}.main{padding:20px 15px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="app"><div class="auth"><h1>Team Portal</h1><p class="muted">Loading workspace…</p></div></div><script type="module" src="./team-portal.js?v=20261126-teamchat1"></script></body></html>
